name: Teste de conexao de dados (B3 / Yahoo Finance)

on:
  schedule:
    - cron: "0 6,12,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance requests

      - run: python teste_conexao_dados.py

      - run: |
          git config user.name "teste-automatico"
          git config user.email "teste@users.noreply.github.com"
          git add resultados.csv
          git commit -m "Resultado do teste $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nada novo pra commitar"
          git push
